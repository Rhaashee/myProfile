<!DOCTYPE html>
<html lang="en">

<head>

    <!-- META -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rhaashee Lokesh | Portfolio</title>

    <!-- TAILWIND -->

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- GOOGLE FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- FONT AWESOME -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/custom.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- NAVBAR -->

    <header id="navbar"></header>

    <!-- MOBILE MENU -->

    <div id="mobile-menu"></div>

    <!-- MAIN -->

    <main>

        <!-- HERO -->

        <section id="home">
            <div id="hero-container"></div>
        </section>

        <!-- ABOUT -->

        <section id="about" class="section">
            <div id="about-container"></div>
        </section>

        <!-- SKILLS -->

        <section id="skills" class="section">
            <div id="skills-container"></div>
        </section>

        <!-- PROJECTS -->

        <section id="projects" class="section">
            <div id="projects-container"></div>
        </section>

        <!-- EXPERIENCE -->

        <section id="experience" class="section">
            <div id="experience-container"></div>
        </section>

        <!-- CERTIFICATIONS -->

        <section id="certifications" class="section">
            <div id="certifications-container"></div>
        </section>

        <!-- EDUCATION -->

        <section id="education" class="section">
            <div id="education-container"></div>
        </section>

        <!-- ACHIEVEMENTS -->

        <section id="achievements" class="section">
            <div id="achievements-container"></div>
        </section>

        <!-- CONTACT -->

        <section id="contact" class="section">

            <div class="contact-wrapper">

                <div class="contact-left">

                    <h2>Let's Connect</h2>

                    <p>
                        Looking for a Software Developer,
                        Frontend Developer or Data Science Graduate?
                    </p>

                    <div id="social-container"></div>

                </div>

                <div class="contact-right">

                    <form id="contact-form">

                        <input type="text" id="name" placeholder="Your Name" required>

                        <input type="email" id="email" placeholder="Your Email" required>

                        <textarea id="message" rows="6" placeholder="Your Message" required></textarea>

                        <button type="submit">

                            Send Message

                        </button>

                        <p id="form-message"></p>

                    </form>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <footer id="footer"></footer>

    <!-- MODAL -->

    <div id="project-modal"></div>

    <!-- BACK TO TOP -->

    <button id="back-to-top">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <!-- THEME TOGGLE -->

    <button id="theme-toggle">
        <i class="fa-solid fa-moon"></i>
    </button>

    <!-- ========================= -->
    <!-- DATA FILES -->
    <!-- ========================= -->

    <script src="js/data/profile.js"></script>
    <script src="js/data/skills.js"></script>
    <script src="js/data/projects.js"></script>
    <script src="js/data/experience.js"></script>
    <script src="js/data/education.js"></script>
    <script src="js/data/certifications.js"></script>
    <script src="js/data/achievements.js"></script>
    <script src="js/data/socials.js"></script>

    <!-- ========================= -->
    <!-- FEATURE FILES -->
    <!-- ========================= -->

    <script src="js/features/navbar.js"></script>
    <script src="js/features/mobile-menu.js"></script>
    <script src="js/features/active-nav.js"></script>

    <script src="js/features/theme-toggle.js"></script>

    <script src="js/features/scroll-animation.js"></script>
    <script src="js/features/typing-effect.js"></script>

    <script src="js/features/BackToTop.js"></script>

    <script src="js/features/hero-render.js"></script>

    <script src="js/features/skills-render.js"></script>

    <script src="js/features/project-render.js"></script>

    <script src="js/features/experience-render.js"></script>

    <script src="js/features/education-render.js"></script>

    <script src="js/features/certification-render.js"></script>

    <script src="js/features/achievement-render.js"></script>

    <script src="js/features/social-render.js"></script>

    <script src="js/features/modal.js"></script>

    <script src="js/features/contact-validation.js"></script>

    <script src="js/features/contact-api.js"></script>

    <script src="js/features/developer-stats.js"></script>

    <!-- MAIN -->

    <script src="js/main.js"></script>

</body>

</html>

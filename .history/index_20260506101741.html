<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rhaashee | Portfolio</title>

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/custom.css">

</head>

<body class="bg-white text-black transition-all duration-500">
    
<!-- ================= HERO SECTION ================= -->

<section
    class="min-h-screen bg-[#f5f5f5] flex flex-col-reverse lg:flex-row items-center justify-between overflow-hidden relative">

    <!-- ================= LEFT CONTENT ================= -->

    <div
        class="w-full lg:w-1/2 px-8 lg:px-24 py-16 flex flex-col justify-center">

        <h1
            class="text-5xl lg:text-7xl font-bold text-slate-900 leading-tight mb-6">

            Rhaashee L

        </h1>

        <!-- Typing Animation -->
        <p id="typing-text"
            class="text-xl lg:text-2xl text-slate-600 font-semibold mb-12 h-10">
        </p>

        <!-- Buttons -->

<div
    class="flex flex-wrap items-center gap-6 mb-14">

    <!-- View Projects -->
    <a href="#projects"
        class="w-[240px] h-[75px] bg-red-400 hover:bg-red-500 text-white rounded-2xl shadow-xl transition-all duration-300 text-xl font-bold flex items-center justify-center">

        View Projects

    </a>

    <!-- Resume -->
    <a href="assets/Rhaashee_L_Resume.pdf"
        target="_blank"
        class="w-[240px] h-[75px] bg-blue-400 hover:bg-blue-600 text-white rounded-2xl shadow-xl transition-all duration-300 text-xl font-bold flex items-center justify-center">

        Download Resume

    </a>

</div>

        <!-- Stats -->
        <div
            class="flex flex-wrap gap-x-8 gap-y-4 text-sm lg:text-lg font-semibold text-slate-700">

            <span>100+ GitHub Commits</span>

            <span>50+ LeetCode Problems</span>

            <span>3+ Projects Built</span>

        </div>

    </div>

    <!-- ================= RIGHT IMAGE ================= -->

    <div
        class="w-full lg:w-1/2 h-[50vh] lg:h-screen">

        <img src="assets/images/Rhaashee.png.jpeg"
            alt="Rhaashee"
            class="w-full h-full object-cover">

    </div>

</section>

    <!-- ================= NAVBAR ================= -->

  <!-- ================= NAVBAR ================= -->

<nav
    class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b shadow-md">

    <div
        class="max-w-7xl mx-auto px-8 py-5 flex items-center justify-between">

        <!-- LEFT LOGO -->

        <a href="#"
            class="text-4xl font-bold text-slate-800">

            RL

        </a>

        <!-- CENTER NAV LINKS -->

        <ul
            class="hidden md:flex items-center gap-16 absolute left-1/2 -translate-x-1/2">

            <li>

                <a href="#projects"
                    class="text-lg font-semibold hover:text-red-500 transition">

                    Projects

                </a>

            </li>

            <li>

                <a href="#education"
                    class="text-lg font-semibold hover:text-red-500 transition">

                    Education

                </a>

            </li>

            <li>

                <a href="#skills"
                    class="text-lg font-semibold hover:text-red-500 transition">

                    Skills

                </a>

            </li>

        </ul>

        <!-- RIGHT BUTTONS -->

        <div class="flex items-center gap-5">

            <!-- Theme -->

            <button id="theme-toggle"
                class="bg-blue-100 hover:bg-blue-200 px-5 py-2 rounded-xl font-semibold transition">

                Theme

            </button>

            <!-- Contact -->

            <a href="#contact"
                class="bg-red-400 hover:bg-red-500 text-white px-6 py-3 rounded-xl transition font-semibold">

                Let's Talk

            </a>

        </div>

    </div>

</nav>

    <!-- ================= PROJECTS ================= -->

    <section id="projects" class="py-24 px-8 lg:px-16">

        <div class="max-w-7xl mx-auto">

            <!-- Heading -->
            <div class="text-center mb-16">

                <h2 class="text-5xl font-bold mb-6">
                    My Projects
                </h2>

                <p class="text-xl text-slate-600 max-w-3xl mx-auto">
                    Modern and scalable applications built using frontend,
                    backend and AI technologies.
                </p>

            </div>

            <!-- Filter Buttons -->
            <div class="flex flex-wrap justify-center gap-4 mb-16">

                <button class="filter-btn bg-red-400 text-white px-6 py-3 rounded-full"
                    data-category="all">
                    All
                </button>

                <button class="filter-btn bg-slate-200 px-6 py-3 rounded-full"
                    data-category="frontend">
                    Frontend
                </button>

                <button class="filter-btn bg-slate-200 px-6 py-3 rounded-full"
                    data-category="mern">
                    MERN
                </button>

                <button class="filter-btn bg-slate-200 px-6 py-3 rounded-full"
                    data-category="ai">
                    AI
                </button>

            </div>

            <!-- Dynamic Projects -->
            <div id="projects-container"
                class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            </div>

        </div>

    </section>

    <!-- ================= EDUCATION ================= -->

    <section id="education"
        class="py-24 px-8 lg:px-16 bg-slate-100">

        <div class="max-w-5xl mx-auto">

            <h2 class="text-5xl font-bold text-center mb-16">
                Education
            </h2>

            <div id="education-container"
                class="space-y-8">
            </div>

        </div>

    </section>

    <!-- ================= SKILLS ================= -->

    <section id="skills"
        class="py-24 px-8 lg:px-16">

        <div class="max-w-7xl mx-auto">

            <h2 class="text-5xl font-bold text-center mb-20">
                Skills
            </h2>

            <div id="skills-container"
                class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            </div>

        </div>

    </section>

    <!-- ================= GITHUB SECTION ================= -->

    <section class="py-24 px-8 lg:px-16 bg-slate-100">

        <div class="max-w-4xl mx-auto text-center">

            <h2 class="text-5xl font-bold mb-16">
                GitHub Stats
            </h2>

            <div id="github-container"></div>

        </div>

    </section>

    <!-- ================= CONTACT ================= -->

    <section id="contact"
        class="py-24 px-8 lg:px-16">

        <div class="max-w-3xl mx-auto">

            <h2 class="text-5xl font-bold text-center mb-16">
                Contact Me
            </h2>

            <form id="contact-form"
                class="bg-white shadow-2xl rounded-3xl p-10 space-y-6">

                <input type="text"
                    id="contact-name"
                    placeholder="Your Name"
                    class="w-full border border-slate-300 rounded-xl px-5 py-4">

                <input type="email"
                    id="contact-email"
                    placeholder="Your Email"
                    class="w-full border border-slate-300 rounded-xl px-5 py-4">

                <textarea id="contact-message"
                    rows="6"
                    placeholder="Your Message"
                    class="w-full border border-slate-300 rounded-xl px-5 py-4"></textarea>

                <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl w-full font-bold transition-all duration-300">
                    Send Message
                </button>

            </form>

        </div>

    </section>

    <!-- ================= BACK TO TOP ================= -->

    <button id="home-swiper"
        class="fixed bottom-8 left-8 bg-pink-400 hover:bg-pink-500 text-white px-5 py-3 rounded-full shadow-xl transition-all duration-300">
        ↑ Top
    </button>

    <!-- ================= SCRIPTS ================= -->

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- DATA FILES -->
    <script src="js/data/projects.js"></script>
    <script src="js/data/skills.js"></script>
    <script src="js/data/education.js"></script>

    <!-- FEATURE FILES -->
    <script src="js/features/skills-render.js"></script>
    <script src="js/features/project-render.js"></script>
    <script src="js/data/projects.js"></script> 
    <script src="js/features/education-render.js"></script>
    <script src="js/features/theme-toggle.js"></script>
    <script src="js/features/modal.js"></script>
    <script src="js/features/contact-validation.js"></script>
    <script src="js/features/mobile-menu.js"></script>
    <script src="js/features/typing-animation.js"></script>
    <script src="js/features/github-api.js"></script>
    <script src="js/features/BackToTop.js"></script>

    <!-- MAIN -->
    <script src="js/main.js"></script>

</body>

</html>
